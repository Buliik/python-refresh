[project]
name = "python-refresh"
version = "0.1.0"
description = "Python practice exercises with pytest"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
python-refresh = "python_refresh:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
