[project]
name = "python-refresh"
version = "0.1.0"
description = "Python practice exercises with pytest"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
python-refresh = "python_refresh:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "slow: waits for provisioning, deselect with -m 'not slow'",
    "smoke: fast core checks to run first",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/W: pycodestyle, F: Pyflakes, I: import order, N: naming (e.g. camelCase),
# UP: modern syntax for your Python version, B: likely bugs (incl. mutable defaults)
select = ["E", "W", "F", "I", "N", "UP", "B"]
